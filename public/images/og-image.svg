<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background with subtle dark grid -->
  <rect width="1200" height="630" fill="#06090B"/>
  
  <defs>
    <radialGradient id="glowTeal" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2FE6B8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06090B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#FF9F2E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06090B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1A2427" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Ambient light -->
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowAmber)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo top left -->
  <g transform="translate(100, 90)">
    <polygon points="27,3 48,15 48,39 27,51 6,39 6,15" stroke="#2FE6B8" stroke-width="3" fill="#071210" stroke-linejoin="round"/>
    <circle cx="27" cy="27" r="5" fill="#2FE6B8"/>
    <path d="M27 15 L27 22 M27 32 L27 39 M15 27 L22 27 M32 27 L39 27" stroke="#2FE6B8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="38" font-family="'Sora', system-ui, sans-serif" font-weight="700" font-size="34" fill="#F4F8F7" letter-spacing="-0.03em">
      Cyber<tspan fill="#2FE6B8">Gram</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 240)">
    <!-- Eyebrow badge -->
    <rect width="320" height="34" rx="17" fill="#0A1613" stroke="#1E3A33" stroke-width="1"/>
    <circle cx="18" cy="17" r="4" fill="#2FE6B8"/>
    <text x="32" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#2FE6B8" letter-spacing="0.08em">
      PLATEFORME DE CYBERSÉCURITÉ
    </text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="'Sora', system-ui, sans-serif" font-weight="700" font-size="58" fill="#F4F8F7" letter-spacing="-0.03em">
      La cybersécurité,
    </text>
    <text x="0" y="160" font-family="'Sora', system-ui, sans-serif" font-weight="700" font-size="58" fill="#2FE6B8" letter-spacing="-0.03em">
      rendue accessible.
    </text>

    <!-- Tagline -->
    <text x="0" y="220" font-family="'Manrope', system-ui, sans-serif" font-size="24" fill="#B7C2BF" letter-spacing="0.02em">
      Apprendre. Échanger. Explorer.
    </text>
  </g>

  <!-- Bottom Badges / Modules preview -->
  <g transform="translate(100, 520)">
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#8A9894">
      cybergram.dev · Apprendre · Communauté · Intelligence · HackPen
    </text>
  </g>

  <!-- Decorative border accent -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#2FE6B8" stroke-width="3"/>
</svg>
